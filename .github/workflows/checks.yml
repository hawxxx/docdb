name: Checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile compare-docdb/compare_docdb.py docdb-data-compare/docdb_data_compare.py docdb-segments/docdb_segments.py
